# PictVerse Web 版 Docker 部署配置
#
# 使用前请修改以下环境变量：
#   PICTVERSE_API_KEY   — 必须替换为你的真实 API Key
#   PICTVERSE_BASE_URL  — 如果使用非 OpenAI 官方接口，请修改为对应的 API 地址
#
services:
  pictverse-web:
    image: pictverse:latest
    container_name: pictverse-web
    ports:
      - "3000:3000"
    environment:
      PICTVERSE_PORT: "3000"
      PICTVERSE_BASE_URL: "https://api.openai.com"
      PICTVERSE_API_KEY: "sk-xxxx"  # ⚠️ 必须替换为真实 API Key
      PICTVERSE_IMAGE_MODEL: "gpt-image-2"
      PICTVERSE_PROMPT_MODEL: "gpt-5.4-mini"
      PICTVERSE_ENABLE_IMAGE_EDIT: "true"
      PICTVERSE_ENABLE_PROMPT_ASSIST: "true"
      PICTVERSE_MAX_IMAGE_COUNT: "10"
      PICTVERSE_MAX_CONCURRENT_REQUESTS: "5"
      PICTVERSE_REQUEST_TIMEOUT_MS: "300000"
    restart: unless-stopped
